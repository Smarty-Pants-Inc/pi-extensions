name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The fork's branch protection requires smarty-ci (smarty-dev#755).
    name: smarty-ci
    # Depot overflow (smarty-dev#2267, Paul YES 2026-10-02): ordinary pull_request runs only; queue drafts, priority-ci, push and other events keep their runner.
    runs-on: ${{ (startsWith(github.ref, 'refs/heads/mergify/merge-queue/') || startsWith(github.ref, 'refs/heads/tmp-mergify/merge-queue/') || startsWith(github.head_ref, 'mergify/merge-queue/') || startsWith(github.head_ref, 'tmp-mergify/merge-queue/') || contains(github.event.pull_request.labels.*.name, 'priority-ci')) && 'ubuntu-latest' || github.event_name == 'pull_request' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    steps:
      # Full history: check:changesets compares the working tree against the
      # merge base with origin/main, which a shallow clone cannot resolve.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: jq empty package.json
      - run: find . -name '*.json' -not -path './node_modules/*' -print0 | xargs -0 -n1 jq empty
      - run: bun run check:package-config
      - run: bun run check:boundaries
      # No check:versions here: it compares each package with npm's `latest`, which upstream
      # signalridge publishes and this fork never does (no npm publish from the fork, smarty-dev#755).
      # Upstream releasing a newer version failed every fork PR (pi-extensions#4, 10-02).
      - run: bun run check:changesets
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:release
      - run: bun run test:config
      - run: bun run smoke:pi
      - run: bun run pack:check
      - run: bun run secret-scan
