name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # The fork's branch protection requires smarty-ci (smarty-dev#755).
    name: smarty-ci
    runs-on: ubuntu-latest
    steps:
      # Full history: check:changesets compares against the merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:json
      - run: bun run check:package-config
      - run: bun run check:boundaries
      - run: bun run check:shared-deps
      - run: bun run check:tests
      # No check:versions here: npm's latest belongs to upstream, not this fork.
      # Upstream releasing a newer version must not fail fork PRs (smarty-dev#755).
      - run: bun run check:changesets
      - run: bun run check:capabilities
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:release
      - run: bun run test:config
      - run: bun run smoke:pi
      - run: bun run pack:check
      - run: bun run secret-scan
