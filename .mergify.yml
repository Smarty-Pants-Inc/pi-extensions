merge_queue:
  mode: serial
  max_parallel_checks: 1
  reset_on_external_merge: always

# smarty-dev's plain rule (smarty-dev#865), as on pi and herdr: the PR, its required checks and this queue
# are the review. The Astra reviewer queues a ready PR after its success verdict; `hold` and DO NOT LAND
# titles keep a PR out.
#
# Cutover (smarty-dev#440, #1110): Mergify injects every required branch-protection check into the
# queue draft, where nobody posts review/astra, so this queue is usable only once main's classic
# protection requires smarty-ci alone. Until then review/astra stays required there too and nothing
# is queued here; PRs land by the owner's direct merge under that protection. The protection change
# (the admin path, smarty-dev#1599) needs the owner's approval bound to its plan digests, and runs
# only after this file is on main, so review/astra is required at every step. Before the first queue
# command, the read-back must show smarty-ci (app 15368) only, and the factory host check must pass.
queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: 30 min
    merge_method: merge
    queue_conditions:
      - base = main
      - -draft
      - -label = hold
      - -title ~= (?i)do not land
      - check-success = review/astra
      # A PR that needs a named security pass waits for review/security, which
      # pi-extensions-security-astra posts on the exact head (smarty-dev#806, #855);
      # so does an automated upstream sync (smarty-dev#755).
      - or:
          - -label = needs-security-pass
          - check-success = review/security
      - or:
          - -head ~= ^sync/upstream-
          - check-success = review/security
      - check-success = smarty-ci
      - -check-failure = smarty-ci
    merge_conditions:
      - check-success = smarty-ci
      - -check-failure = smarty-ci

# The fleet's write App bot may queue (smarty-dev#735, #736): GitHub reports App bots as permission
# none, so the default `sender-permission >= write` restriction refused its queue commands.
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
  # The stuck-work check's R4 posts `@mergifyio refresh` as the write App (smarty-dev#868, #983).
  refresh:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
